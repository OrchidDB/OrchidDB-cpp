name: Build and release
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && '[{"os":"ubuntu-22.04","duckdb":"linux-amd64","library":"liborchiddb_compiler.so","duckdb_library":"libduckdb.so"},{"os":"macos-14","duckdb":"osx-universal","library":"liborchiddb_compiler.dylib","duckdb_library":"libduckdb.dylib"},{"os":"macos-15-intel","duckdb":"osx-universal","library":"liborchiddb_compiler.dylib","duckdb_library":"libduckdb.dylib"}]'
          || '[{"os":"ubuntu-22.04","duckdb":"linux-amd64","library":"liborchiddb_compiler.so","duckdb_library":"libduckdb.so"}]') }}
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Require shared compiler artifacts
      shell: bash
      env:
        NATIVE_RUNS: ${{ inputs.native_runs }}
        NATIVE_RUN_ID: ${{ inputs.native_run_id }}
      run: python -c 'import os; assert os.environ["NATIVE_RUNS"] != "{}" or os.environ["NATIVE_RUN_ID"], "Build the shared compiler once before
        packaging clients"'
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag || github.ref }}
    - name: Download and verify the pinned platform compiler
      env:
        GH_TOKEN: ${{ github.token }}
        NATIVE_RUN_ID: ${{ inputs.native_run_id }}
        NATIVE_RUNS: ${{ inputs.native_runs }}
      shell: bash
      run: |
        python - <<'PYTHON'
        import hashlib, json, os, platform, shutil, subprocess, sys, tarfile
        from pathlib import Path
        targets = {('Linux','x86_64'): ('x86_64-unknown-linux-gnu','liborchiddb_compiler.so'), ('Darwin','arm64'): ('aarch64-apple-darwin','liborchiddb_compiler.dylib'), ('Darwin','x86_64'): ('x86_64-apple-darwin','liborchiddb_compiler.dylib'), ('Windows','AMD64'): ('x86_64-pc-windows-msvc','orchiddb_compiler.dll')}
        target, library = targets[(platform.system(), platform.machine())]
        platform_name = {('Linux','x86_64'):'linux-x86_64', ('Darwin','arm64'):'macos-aarch64', ('Darwin','x86_64'):'macos-x86_64', ('Windows','AMD64'):'windows-x86_64'}[(platform.system(), platform.machine())]
        os.environ['NATIVE_RUN_ID'] = str(json.loads(os.environ['NATIVE_RUNS']).get(platform_name) or os.environ['NATIVE_RUN_ID'])
        assert os.environ['NATIVE_RUN_ID'].isdigit(), 'Missing shared compiler run for '+platform_name
        run = json.loads(subprocess.check_output(['gh','api','repos/OrchidDB/OrchidDB-native/actions/runs/'+os.environ['NATIVE_RUN_ID']], text=True))
        pin = Path('NATIVE_REVISION').read_text().strip()
        subprocess.run(['gh','run','download',os.environ['NATIVE_RUN_ID'],'--repo','OrchidDB/OrchidDB-native','--name','compiler-'+target,'--dir','.verified-native'],check=True)
        source = Path('.verified-native/SOURCE_COMMIT')
        assert (source.read_text().strip() if source.exists() else run['head_sha']) == pin, 'Compiler source does not match NATIVE_REVISION'
        archives = list(Path('.verified-native').glob('*.tar.gz'))
        assert len(archives) == 1
        with tarfile.open(archives[0]) as tar:
            metadata = json.load(tar.extractfile('manifest.json'))
            binary = tar.extractfile(metadata['library']).read()
        assert metadata['target'] == target
        assert hashlib.sha256(binary).hexdigest() == metadata['sha256']
        if Path('CORE_REVISION').exists():
            assert metadata['core_revision'] == Path('CORE_REVISION').read_text().strip()
        Path('.verified-native/lib').mkdir(exist_ok=True)
        Path('.verified-native/lib',library).write_bytes(binary)
        with open(os.environ['GITHUB_ENV'],'a') as env:
            env.write('VERIFIED_LIBRARY='+Path('.verified-native/lib',library).resolve().as_posix()+'\n')
            env.write('VERIFIED_CORE='+metadata['core_revision']+'\n')
        PYTHON
    - name: Stage verified compiler
      run: |
        mkdir -p _native
        cp "$VERIFIED_LIBRARY" _native/
    - run: cmake -S . -B build -DORCHIDDB_BUILD_TESTS=OFF -DORCHIDDB_NATIVE_LIBRARY="$PWD/_native/${{ matrix.library }}"
    - run: cpack --config build/CPackConfig.cmake
    - name: Check tag version
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        VERSION=$(sed -n 's/project(OrchidDB VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)
        test "$GITHUB_REF_NAME" = "v$VERSION"
    - name: Record source revision
      shell: bash
      run: git rev-parse HEAD > SOURCE_COMMIT
    - uses: actions/upload-artifact@v4
      with:
        name: package-${{ matrix.os }}
        path: |-
          *.tar.gz
          SOURCE_COMMIT
        overwrite: true
run-name: orchiddb-cpp ${{ inputs.request_id }} ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Source tag or revision to package
        type: string
        default: main
      native_run_id:
        description: Verified native compiler workflow run (optional)
        type: string
        default: ''
      native_runs:
        description: Platform to shared-native build run ID JSON map
        type: string
        default: '{}'
      request_id:
        description: Coordinator request ID
        type: string
        default: ''
