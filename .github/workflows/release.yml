name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Source tag or revision to package
        type: string
        default: main
      native_run_id:
        description: Verified native compiler workflow run (optional)
        type: string
        default: ''
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include: ${{ fromJSON((startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && '[{"os":"ubuntu-22.04","duckdb":"linux-amd64","library":"liborchiddb_compiler.so","duckdb_library":"libduckdb.so"},{"os":"macos-14","duckdb":"osx-universal","library":"liborchiddb_compiler.dylib","duckdb_library":"libduckdb.dylib"},{"os":"macos-15-intel","duckdb":"osx-universal","library":"liborchiddb_compiler.dylib","duckdb_library":"libduckdb.dylib"}]' || '[{"os":"ubuntu-22.04","duckdb":"linux-amd64","library":"liborchiddb_compiler.so","duckdb_library":"libduckdb.so"}]') }}
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        if: inputs.native_run_id == ''
      - uses: Swatinem/rust-cache@v2
        if: inputs.native_run_id == ''
        with: {workspaces: .native-build/orchiddb-native}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Download and verify the pinned platform compiler
        if: inputs.native_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN_ID: ${{ inputs.native_run_id }}
        shell: bash
        run: |
          python - <<'PYTHON'
          import hashlib, json, os, platform, shutil, subprocess, sys, tarfile
          from pathlib import Path
          targets = {('Linux','x86_64'): ('x86_64-unknown-linux-gnu','liborchiddb_compiler.so'), ('Darwin','arm64'): ('aarch64-apple-darwin','liborchiddb_compiler.dylib'), ('Darwin','x86_64'): ('x86_64-apple-darwin','liborchiddb_compiler.dylib'), ('Windows','AMD64'): ('x86_64-pc-windows-msvc','orchiddb_compiler.dll')}
          target, library = targets[(platform.system(), platform.machine())]
          run = json.loads(subprocess.check_output(['gh','api','repos/OrchidDB/OrchidDB-native/actions/runs/'+os.environ['NATIVE_RUN_ID']], text=True))
          pin = Path('NATIVE_REVISION').read_text().strip()
          assert run['head_sha'] == pin, 'Compiler workflow does not match NATIVE_REVISION'
          subprocess.run(['gh','run','download',os.environ['NATIVE_RUN_ID'],'--repo','OrchidDB/OrchidDB-native','--name','compiler-'+target,'--dir','.verified-native'],check=True)
          archives = list(Path('.verified-native').glob('*.tar.gz'))
          assert len(archives) == 1
          with tarfile.open(archives[0]) as tar:
              metadata = json.load(tar.extractfile('manifest.json'))
              binary = tar.extractfile(metadata['library']).read()
          assert metadata['target'] == target
          assert hashlib.sha256(binary).hexdigest() == metadata['sha256']
          if Path('CORE_REVISION').exists():
              assert metadata['core_revision'] == Path('CORE_REVISION').read_text().strip()
          Path('.verified-native/lib').mkdir(exist_ok=True)
          Path('.verified-native/lib',library).write_bytes(binary)
          with open(os.environ['GITHUB_ENV'],'a') as env:
              env.write('VERIFIED_LIBRARY='+Path('.verified-native/lib',library).resolve().as_posix()+'\n')
              env.write('VERIFIED_CORE='+metadata['core_revision']+'\n')
          PYTHON
      - run: ./scripts/build-native.sh
        if: inputs.native_run_id == ''
      - name: Stage verified compiler
        if: inputs.native_run_id != ''
        run: |
          mkdir -p _native
          cp "$VERIFIED_LIBRARY" _native/
      - name: Test the platform compiler with DuckDB
        env:
          ORCHIDDB_NATIVE_LIBRARY: ${{ github.workspace }}/_native/${{ matrix.library }}
        run: bash scripts/test.sh
      - run: cmake -S . -B build -DORCHIDDB_NATIVE_LIBRARY="$PWD/_native/${{ matrix.library }}"
      - run: cpack --config build/CPackConfig.cmake
      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(sed -n 's/project(OrchidDB VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)
          test "$GITHUB_REF_NAME" = "v$VERSION"
      - uses: actions/upload-artifact@v4
        with: {name: 'package-${{ matrix.os }}', path: '*.tar.gz'}
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: 'package-*', path: packages, merge-multiple: true}
      - run: gh release create "$GITHUB_REF_NAME" packages/*.tar.gz --repo "$GITHUB_REPOSITORY" --draft --generate-notes
        env: {GH_TOKEN: '${{ github.token }}'}
