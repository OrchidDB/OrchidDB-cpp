name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            duckdb: linux-amd64
            library: liborchiddb_compiler.so
            duckdb_library: libduckdb.so
          - os: macos-14
            duckdb: osx-universal
            library: liborchiddb_compiler.dylib
            duckdb_library: libduckdb.dylib
          - os: macos-15-intel
            duckdb: osx-universal
            library: liborchiddb_compiler.dylib
            duckdb_library: libduckdb.dylib
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: {workspaces: .native-build/orchiddb-native}
      - run: ./scripts/build-native.sh
      - run: ./scripts/test.sh
        env: {ORCHIDDB_NATIVE_LIBRARY: '${{ github.workspace }}/_native/${{ matrix.library }}'}
      - run: cmake -S . -B build -DORCHIDDB_NATIVE_LIBRARY="$PWD/_native/${{ matrix.library }}"
      - run: cpack --config build/CPackConfig.cmake
      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(sed -n 's/project(OrchidDB VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)
          test "$GITHUB_REF_NAME" = "v$VERSION"
      - uses: actions/upload-artifact@v4
        with: {name: 'package-${{ matrix.os }}', path: '*.tar.gz'}
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: 'package-*', path: packages, merge-multiple: true}
      - run: gh release create "$GITHUB_REF_NAME" packages/*.tar.gz --repo "$GITHUB_REPOSITORY" --generate-notes
        env: {GH_TOKEN: '${{ github.token }}'}
